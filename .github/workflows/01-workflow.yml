name: workflow

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build y Push imagen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mi-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mi-app:${{ github.sha }}

  deploy:
    name: Deploy en EC2
    runs-on: ubuntu-latest
    needs: build # espera a que el build termine

    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/mi-app"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/mi-app

            cat > .env << 'EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DB_HOST=${{ secrets.OCI_DB_HOST }}
            DB_PORT=${{ secrets.OCI_DB_PORT }}
            DB_NAME=${{ secrets.OCI_DB_NAME }}
            DB_USER=${{ secrets.OCI_DB_USER }}
            DB_PASSWORD=${{ secrets.OCI_DB_PASSWORD }}
            EOF

            mkdir -p wallet 
            echo "${{ secrets.OCI_WALLET_BASE64 }}" | base64 -d > wallet.zip
            unzip -o wallet.zip -d wallet/
            rm wallet.zip

            sed -i 's|DIRECTORY=.*)|DIRECTORY=/app/wallet)|g' wallet/sqlnet.ora

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deploy completado: $(date)"
