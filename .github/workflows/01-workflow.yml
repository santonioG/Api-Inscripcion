name: workflow

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build y Push imagen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mi-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mi-app:${{ github.sha }}

  deploy:
    name: Deploy en EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/home/ubuntu/mi-app"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            mkdir -p /home/ubuntu/mi-app
            cd /home/ubuntu/mi-app

            cat > .env << 'EOF'
            DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            DB_URL=${{ secrets.OCI_DB_URL }}
            DB_USERNAME=${{ secrets.OCI_DB_USERNAME }}
            DB_PASSWORD=${{ secrets.OCI_DB_PASSWORD }}
            TNS_ADMIN=/app/wallet
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            EOF

            mkdir -p wallet

            echo '${{ secrets.OCI_WALLET_BASE64 }}' | base64 -d > wallet.zip

            unzip -o wallet.zip -d wallet/

            rm wallet.zip


            cat > wallet/sqlnet.ora << 'EOF'
            WALLET_LOCATION =
              (SOURCE =
                (METHOD = file)
                (METHOD_DATA =
                  (DIRECTORY = /app/wallet)
                )
              )

            SSL_SERVER_DN_MATCH=yes
            EOF


            docker compose pull


            docker compose down

            docker compose up -d --remove-orphans


            docker image prune -f

            echo "Deploy completado: $(date)"
