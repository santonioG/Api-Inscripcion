services:
  app:
    image: ${DOCKERHUB_USERNAME}/mi-app:latest
    container_name: mi_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      TNS_ADMIN:   /app/wallet
      DB_DSN:      ${DB_DSN}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS:   "-Xms256m -Xmx512m"
    volumes:
      - ./wallet:/app/wallet
    env_file:
      - .env